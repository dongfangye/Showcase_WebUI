<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物品展示平台</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 左侧导航栏 -->
        <nav class="sidebar">
            <div class="logo">
                <h2>📦 展品馆</h2>
            </div>
            <ul class="nav-menu">
                <li class="nav-item active" data-category="all">
                    <span class="icon">🏠</span>
                    <span>全部物品</span>
                </li>
                <li class="nav-item" data-category="electronics">
                    <span class="icon">💻</span>
                    <span>电子产品</span>
                </li>
                <li class="nav-item" data-category="furniture">
                    <span class="icon">🪑</span>
                    <span>家具装饰</span>
                </li>
                <li class="nav-item" data-category="art">
                    <span class="icon">🎨</span>
                    <span>艺术品</span>
                </li>
                <li class="nav-item" data-category="books">
                    <span class="icon">📚</span>
                    <span>书籍文具</span>
                </li>
                <li class="nav-item" data-category="clothing">
                    <span class="icon">👔</span>
                    <span>服饰配件</span>
                </li>
            </ul>
            <div class="sidebar-footer">
                <div class="user-info">
                    <span>👤 访客</span>
                </div>
            </div>
        </nav>

        <!-- 右侧显示区域 -->
        <main class="main-content">
            <header class="content-header">
                <h1 id="category-title">全部物品</h1>
                <div class="header-actions">
                    <span id="item-count">共 0 件</span>
                    <button id="refresh-btn">🔄 刷新</button>
                </div>
            </header>
            <div class="content-body">
                <div id="item-grid" class="item-grid">
                    <!-- 物品卡片由 JavaScript 动态生成 -->
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
