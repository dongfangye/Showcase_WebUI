<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>物品展示平台</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <!-- 自定义右键菜单 -->
      <div id="custom-context-menu" class="context-menu">
        <div class="context-menu-item" data-action="refresh">刷新</div>
        <div class="context-menu-item" data-action="copy">复制</div>
        <div class="context-menu-item" data-action="select-all">全选</div>

        <div class="context-menu-divider"></div>

        <div class="context-menu-item" data-action="custom">我的功能</div>
      </div>
      <!-- 左侧导航栏 -->
      <nav class="sidebar" id="sidebar">
        <div class="logo">
          <h2>📦 展品馆</h2>
        </div>

        <ul class="nav-menu" id="nav-menu">
          <!-- JS动态生成 -->
        </ul>

        <div class="sidebar-footer">
          <button class="settings-btn" id="settings-btn" title="设置">
            ⚙️
          </button>
        </div>
      </nav>

      <!-- 折叠把手：侧边栏右侧贯穿全高，整条可点击，实现折叠/展开 -->
      <div class="sidebar-handle" id="sidebarToggle" title="折叠 / 展开侧边栏">
        <span class="handle-arrow">◀</span>
      </div>

      <!-- 右侧内容主区域 -->
      <main class="main-content">
        <header class="content-header">
          <h1 id="category-title">全部物品</h1>

          <div class="header-actions">
            <span id="item-count"> 共0件 </span>

            <button id="refresh-btn">🔄 刷新</button>
          </div>
        </header>

        <div class="content-body">
          <div id="item-grid" class="item-grid">
            <!-- JS生成商品 -->
          </div>
        </div>
      </main>
      <!-- 弹窗自定义设置面板 -->
      <div class="settings-panel" id="settings-panel">
        <div class="settings-header">
          <h2>设置</h2>
          <button id="close-settings">✕</button>
        </div>

        <!-- Tab（由 setting.json 动态生成） -->
        <div class="settings-tabs" id="settings-tabs"></div>

        <div class="settings-content" id="settings-content"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
